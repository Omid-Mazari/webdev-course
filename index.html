<!DOCTYPE html>
<main>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Application Form</title>
        </head>

        <body>
            <h1>Application Form</h1>
            
            <form action="">

                <h3>1. Personal Information</h3>

                <label>First Name: </label>
                <input style="width: 170px;" type="text" minlength="2" maxlength="15" placeholder="Please enter your first name." required><br><br>

                <label>Family Name: </label>
                <input style="width: 185px;" type="text" minlength="3" maxlength="20" placeholder="Please enter your family name." required><br><br>

                <label>Date of Birth: </label>
                <input style="width: 100px;" type="date" required><br><br>

                <label>Gender: </label>
                <select required>
                    <option value="">Select an option</option>
                    <option value="">Male</option>
                    <option value="">Female</option>
                    <option value="">Other</option>
                    <option value="">Prefer not to say</option>
                </select> <br><br>

                <label>Nationality: </label>
                <input style="width: 175px;" type="text" placeholder="Please enter your Nationality" required><br><br>

                <label>ID Number: </label>
                <input style="width: 175px;" type="" placeholder="Please enter your ID number" required><br><br>

                <label>Email Address: </label>
                <input style="width: 195px;" type="email" placeholder="Please enter your email Address" required><br><br>

                <label>Phone number: </label>
                <input style="width: 200px;" type="tel" placeholder="Please enter your phone number" required><br><br>

                <h3>2. Academic Qualifications</h3>

                <label>Academic Qualification: </label>
                <select style="width: fit-content;" required>
                    <option>Select an option</option>
                    <option>High School Diploma</option>
                    <option>Bachelor's Degree</option>
                    <option>Master's Degree</option>
                    <option>PhD</option>
                </select><br><br>

                <label>Issuing Institution</label>
                <input style="width: 210px;" type="text" placeholder="Please enter the Issuing Institution"><br><br>

                <label>Graduation Date: </label>
                <input style="width: 100px;" type="date"><br><br>

                <label>GPA: </label>
                <input style="width: 150px;" type="number" min="0.0" max="4.0" step="0.01" placeholder="Please enter your GPA"><br><br>

                <h3>3. Work Experience</h3>

                <label>Do you have any Experience in this field?</label><br>
                Yes <input type="radio" name="select"> 
                No <input type="radio" name="select"><br><br>

                <label>Amount of Experience</label>
                <select>
                    <option><1 year</option>
                    <option>1-2 years</option>
                    <option>2+ years</option>
                </select><br><br>

                <label>Company: </label>
                <input style="width: 235px;" type="text" placeholder="Please enter the name of the Company"><br><br>

                <h3>4. Documents</h3>

                <label>Portrait: </label>
                <input type="image"><br><br>

                <label>ID card: </label>
                <input type="image"><br><br>

                <label>CV: </label>
                <input type="file"><br><br>

                <button>Submit</button>
                <button>Save</button>
                <button type="reset">Reset</button>
            </form>
        </body>
    </html>
</main>
