<!DOCTYPE html>
<main>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Visa Application Form</title>
        </head>

        <body>
            <h1>Visa Application Form</h1>
            
            <form action="">
                <h3>1. Personal Information</h3>

                <label>First Name: </label>
                <input type="text" minlength="2" maxlength="15" placeholder="Please enter your first name." required><br><br>

                <label>Family Name: </label>
                <input type="text" minlength="3" maxlength="20" placeholder="Please enter your family name." required><br><br>

                <label>Date of Birth: </label>
                <input type="date" required><br><br>

                <label>Gender: </label>
                <select required>
                    <option value="">Select your Gender</option>
                    <option value="">Male</option>
                    <option value="">Female</option>
                    <option value="">Other</option>
                    <option value="">Prefer not to say</option>
                </select> <br><br>

                <label>Nationality: </label>
                <input type="text" placeholder="Please enter your Nationality" required><br><br>

                <label>Email Address: </label>
                <input type="email" required><br><br>

                <label>Phone number: </label>
                <input type="tel" required><br><br>

                <h3>2. Passport Information</h3>
                
                <label>Passport Number: </label>
                <input type="text" required><br><br>

                

                <button>Submit</button>
                <button>Save</button>
                <button type="reset">Reset</button>
            </form>
        </body>
    </html>
</main>
