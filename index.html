<!DOCTYPE html>
<main>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Visa Application Form</title>
        </head>

        <body>
            <h1>Visa Application Form</h1>
            
            <form action="">
                <label>First Name: </label>
                <input type="text" minlength="2" maxlength="15" placeholder="Please enter your first name.">

                <label>Family Name: </label>
                <input type="text" minlength="3" maxlength="20" placeholder="Please enter your family name."> <br><br>

                <label>Date of Birth: </label>
                <input type="date">

                <label>Gender: </label>
                <select>
                    <option value="">Select your Gender</option>
                    <option value="">Male</option>
                    <option value="">Female</option>
                    <option value="">Other</option>
                    <option value="">Prefer not to say</option>
                </select>
            </form>
        </body>
    </html>
</main>
